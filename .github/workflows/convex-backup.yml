# Exports the production Convex database to Google Cloud Storage every day.
# Convex file storage is intentionally excluded.
#
# Required repository variables:
#   GCP_WORKLOAD_IDENTITY_PROVIDER - full Workload Identity Provider resource name
#   GCP_BACKUP_SERVICE_ACCOUNT     - service account email used by GitHub Actions
#   GCS_BACKUP_BUCKET              - bucket name only (without gs://)
#
# Required repository secret:
#   CONVEX_DEPLOY_KEY              - production Convex deploy key
name: Backup Convex to GCS

on:
  schedule:
    - cron: "17 15 * * *" # Daily at 01:17 AEST / 02:17 AEDT
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: convex-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export production database
        id: export
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          backup_path="convex-production-${timestamp}.zip"
          npx convex export --prod --path "$backup_path"
          unzip -t "$backup_path"
          if unzip -Z1 "$backup_path" | grep '^_storage/' >/dev/null; then
            echo "::error::Convex file storage was unexpectedly included in the export."
            exit 1
          fi
          echo "path=$backup_path" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y/%m/%d')" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SERVICE_ACCOUNT }}

      - name: Upload backup to Google Cloud Storage
        id: upload
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3
        with:
          path: ${{ steps.export.outputs.path }}
          destination: ${{ vars.GCS_BACKUP_BUCKET }}/convex/production/${{ steps.export.outputs.date }}
          parent: false
          gzip: false
          process_gcloudignore: false

      - name: Report uploaded object
        env:
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
        run: echo "Uploaded $UPLOADED"
