# Build and submit to production — manual trigger only.
# Run from the Actions tab when you're ready to ship.
name: EAS Production

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build"
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: read

concurrency:
  group: eas-production
  cancel-in-progress: false

jobs:
  build-production:
    name: Build & submit → Production
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Resolve platform
        run: |
          platform="${{ inputs.platform || 'both' }}"
          [ "$platform" = "both" ] && platform="all"
          echo "EAS_PLATFORM=$platform" >> "$GITHUB_ENV"

      - name: Build & submit to production
        run: eas build --platform "${{ env.EAS_PLATFORM }}" --profile production --non-interactive --auto-submit --json > "$RUNNER_TEMP/eas-builds.json"

      - name: Post to Data and IT in Google Chat
        if: always()
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          PLATFORM_INPUT: ${{ inputs.platform || 'both' }}
          ACTOR: ${{ github.triggering_actor }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: bash .github/scripts/eas-production-chat.sh
