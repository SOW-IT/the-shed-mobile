name: EAS Production

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build"
        type: choice
        options: [both, ios, android]
        default: both
      force:
        description: "Build even if main's native code matches the last store build (otherwise it's sent over the air)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eas-production
  cancel-in-progress: false

jobs:
  build-production:
    name: Build & submit → Production
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Skip platforms whose native code matches the last store build
        id: fingerprint
        env:
          PLATFORM_INPUT: ${{ inputs.platform || 'both' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node scripts/eas-fingerprint-check.mjs production

      - name: Publish over the air instead of building
        id: ota
        if: steps.fingerprint.outputs.update_platform != 'none'
        env:
          UPDATE_PLATFORM: ${{ steps.fingerprint.outputs.update_platform }}
          CHANNEL: ${{ steps.fingerprint.outputs.channel }}
          EXPO_PUBLIC_CONVEX_URL: https://giant-bloodhound-191.ap-southeast-2.convex.cloud
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Only main is published over the air to production; this run is on ${GITHUB_REF_NAME}. Tick force to build instead."
            exit 1
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::main is now ${main_sha}, so its own EAS Update run publishes the newer code; nothing published here."
            exit 0
          fi
          test -n "$EXPO_PUBLIC_CONVEX_URL"
          eas update --channel "$CHANNEL" --environment production --platform "$UPDATE_PLATFORM" --auto --non-interactive
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Build & submit to production
        if: steps.fingerprint.outputs.eas_platform != 'none'
        env:
          EAS_PLATFORM: ${{ steps.fingerprint.outputs.eas_platform }}
        run: eas build --platform "$EAS_PLATFORM" --profile production --non-interactive --auto-submit --json > "$RUNNER_TEMP/eas-builds.json"

      - name: Post to Data and IT in Google Chat
        if: always()
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          PLATFORM_INPUT: ${{ inputs.platform || 'both' }}
          EAS_PLATFORM: ${{ steps.fingerprint.outputs.eas_platform }}
          UPDATE_PLATFORM: ${{ steps.ota.outputs.published == 'true' && steps.fingerprint.outputs.update_platform || 'none' }}
          ACTOR: ${{ github.triggering_actor }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: bash .github/scripts/eas-production-chat.sh
