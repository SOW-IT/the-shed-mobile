name: Release version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for a credential that can push to main
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ] && [ -z "$RELEASE_PUSH_TOKEN" ]; then
            echo "::error title=No release credential::Neither RELEASE_DEPLOY_KEY nor RELEASE_PUSH_TOKEN is set, so main can't be given its next version. GITHUB_TOKEN can't be used: main requires the ci check, and its pushes wouldn't start Convex Deploy or EAS Update."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 100
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Give main its next patch version
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet --depth=100 origin main
            git reset --quiet --hard FETCH_HEAD
            result="$(node scripts/release-version.mjs release)"
            printf '%s\n' "$result"
            released="$(printf '%s\n' "$result" | sed -n 's/^released=//p')"
            if [ "$released" != "true" ]; then
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$(printf '%s\n' "$result" | sed -n 's/^version=//p')"
            commits="$(printf '%s\n' "$result" | sed -n 's/^commits=//p')"
            git add -A
            git commit --quiet -m "chore(release): ${version}"
            if git push origin HEAD:main; then
              {
                echo "released=true"
                echo "version=${version}"
                echo "commits=${commits}"
              } >> "$GITHUB_OUTPUT"
              echo "::notice title=Released ${version}::main is now ${version} at $(git rev-parse --short HEAD)."
              exit 0
            fi
            echo "::warning::main moved while it was being numbered (attempt ${attempt}), so it is numbered again from the new main."
          done
          echo "::error title=Release not pushed::main couldn't be given its next version after 3 attempts."
          exit 1

      - name: Post merged pull requests to Google Chat
        if: ${{ steps.release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RELEASED: ${{ steps.release.outputs.released }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASED_COMMITS: ${{ steps.release.outputs.commits }}
          TRIGGER_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions?query=branch%3Amain
        run: bash .github/scripts/pr-merged-chat.sh
