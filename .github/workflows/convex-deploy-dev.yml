# Pushes the Convex functions and schema to the shared **dev** deployment
# (successful-lynx-56), which the staging app, the dev web app and local runs
# all talk to. Without this, dev only moved when someone ran `npx convex dev`
# by hand, so a staging build of main could call functions dev didn't have
# ("Could not find public function for 'mahjong:mine'").
#
# Prod is deployed by convex-deploy.yml; this workflow never touches it. The
# key it uses must be a dev deploy key for successful-lynx-56, and the job
# checks that twice before pushing: the key must start with `dev:`, and a dry
# run with it must target successful-lynx-56. Older dev keys read
# `dev:successful-lynx-56|<token>`; current ones are `dev:<token>` and don't
# name their deployment, which is why the dry run asks Convex instead.
name: Convex Deploy (dev)

on:
  push:
    branches: [main]
  # Run by hand from a branch to put that branch's functions on dev, e.g.
  # before sending the branch to the staging app with EAS Staging. The next
  # merge to main puts main's functions back, unless the branch's schema let
  # dev store documents main's schema rejects: then that push fails schema
  # validation (prod is unaffected) until the documents are fixed on dev or
  # main's schema accepts them.
  workflow_dispatch:

permissions:
  contents: read

# Merges queue in their own group and runs by hand in another, so a run by
# hand can never evict a merge's queued run (GitHub keeps one running and one
# queued per group, and a newer queued run cancels the older queued one).
# Within a group nothing is cancelled halfway. A run by hand and a merge's run
# can overlap; dev ends on whichever finishes last, and the next merge to main
# puts main back either way.
concurrency:
  group: convex-deploy-dev-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy key
        id: key
        env:
          CONVEX_DEPLOY_KEY_DEV: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY_DEV" ]; then
            echo "::notice::CONVEX_DEPLOY_KEY_DEV is not set, so dev Convex was not deployed. Add a dev deploy key for successful-lynx-56 (Convex dashboard → dev deployment → Settings → Deploy keys) as a repository secret."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Old format: dev:successful-lynx-56|<token>. New format: dev:<token>.
          # An old-format key naming another deployment, or any prod:,
          # preview: or project: key, is refused here. The key is never echoed.
          case "$CONVEX_DEPLOY_KEY_DEV" in
            dev:successful-lynx-56\|?*) ;;
            dev:*\|*)
              echo "::error::CONVEX_DEPLOY_KEY_DEV is a dev deploy key for another deployment, not successful-lynx-56. Refusing to deploy."
              exit 1
              ;;
            dev:?*) ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY_DEV is not a dev deploy key for successful-lynx-56. Refusing to deploy."
              exit 1
              ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.key.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.configured == 'true'
        run: npm ci
      # A dev:<token> key doesn't say which deployment it's for, so ask Convex
      # with a dry run (it pushes nothing) and require the target URL to be
      # successful-lynx-56's. Only the target URL is printed, never the key.
      - name: Check deploy target
        if: steps.key.outputs.configured == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: |
          out="$RUNNER_TEMP/convex-dry-run.log"
          if ! npx convex deploy --dry-run --typecheck disable --codegen disable > "$out" 2>&1; then
            echo "::error::The dry run against dev Convex failed, so nothing was deployed. Its last lines:"
            tail -n 30 "$out"
            exit 1
          fi
          target=$(sed 's/\x1b\[[0-9;]*m//g' "$out" | grep -oE 'https://[a-z0-9-]+(\.[a-z0-9-]+)*\.convex\.cloud' | head -n 1 || true)
          if [ -z "$target" ]; then
            echo "::error::The dry run didn't print a deployment URL, so the key's target couldn't be checked. Refusing to deploy."
            exit 1
          fi
          case "$target" in
            https://successful-lynx-56.convex.cloud|https://successful-lynx-56.*.convex.cloud)
              echo "Deploy key targets $target (successful-lynx-56)."
              ;;
            *)
              echo "::error::This dev key points at $target, not the shared dev deployment successful-lynx-56. Refusing to deploy."
              exit 1
              ;;
          esac
      - name: Deploy to dev Convex
        if: steps.key.outputs.configured == 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Deploying $GITHUB_REF_NAME to the shared dev deployment. The next merge to main replaces it."
          fi
          npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
