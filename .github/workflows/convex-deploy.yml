name: Convex Deploy

# A merge to main publishes the phones' JavaScript first (EAS Update), then
# deploys the prod backend here once that run has finished, whether it
# succeeded or failed, for the commit it ran for. A cancelled EAS Update run
# deploys nothing: GitHub only cancels a queued one when a newer merge is
# queued behind it, and that merge's own run deploys the newer code.
on:
  workflow_run:
    workflows: ["EAS Update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only the run a merge started (not EAS Update by hand), and only once it
    # has finished: success, failure (the update reached no store build, or
    # latestOta couldn't be raised) or a timeout all still deploy Convex.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip a commit a newer merge has replaced
        id: current
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" = "$DEPLOYED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now ${main_sha}; ${DEPLOYED_SHA} is superseded, so the Convex Deploy that follows that merge's EAS Update run deploys the newer code."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.current.outputs.deploy == 'true'

      - name: Deploy to Convex
        if: steps.current.outputs.deploy == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            npx convex deploy
          else
            npx convex deploy --preview-name "$REF_NAME"
          fi
