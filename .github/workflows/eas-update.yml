name: EAS Update

# A merge to main runs Release version, then Convex Deploy (dev)
# (convex-deploy-dev.yml), so the staging channel never gets JavaScript that
# calls functions dev doesn't have. This runs once that run has finished, for
# the same commit, whatever its result: a failed, skipped (no dev key) or
# cancelled dev deploy never holds back the production update or prod Convex.
# Convex Deploy (prod) follows once this run has finished (convex-deploy.yml).
# A run of Convex Deploy (dev) by hand doesn't start this.
#
# Only main's tip publishes, so a merge that Release version gave a
# `chore(release)` commit publishes once, from that commit: app.json there
# carries the new version, which the update reports and raises latestOta to.
on:
  workflow_run:
    workflows: ["Convex Deploy (dev)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Merges (arriving as workflow_run) queue in their own group, so only a newer
# merge can cancel a queued merge's run (and that newer merge's run publishes
# and deploys Convex). A run by hand has its own group and can never cancel a
# merge's queued run.
concurrency:
  group: eas-update-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip a commit a newer merge has replaced
        id: current
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" = "$DEPLOYED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now ${main_sha}; ${DEPLOYED_SHA} is superseded, so the run for main's tip (a release commit or a newer merge) publishes the update."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.current.outputs.publish == 'true'

      - name: Set up EAS
        if: steps.current.outputs.publish == 'true'
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Publish to the production channel
        id: production
        if: steps.current.outputs.publish == 'true'
        env:
          EXPO_PUBLIC_CONVEX_URL: https://giant-bloodhound-191.ap-southeast-2.convex.cloud
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL"
          eas update --channel production --environment production --auto --non-interactive --json > "$RUNNER_TEMP/eas-update-production.json"

      - name: Publish to the staging channel
        if: steps.current.outputs.publish == 'true'
        env:
          APP_VARIANT: staging
          EXPO_PUBLIC_CONVEX_URL: https://successful-lynx-56.ap-southeast-2.convex.cloud
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL"
          eas update --channel staging --environment preview --auto --non-interactive

      - name: Report the production update and raise the latest over-the-air version
        if: ${{ always() && steps.current.outputs.publish == 'true' }}
        env:
          UPDATES_FILE: ${{ runner.temp }}/eas-update-production.json
          CHANNEL: production
          BUILD_PROFILE: production
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          PUBLISH_OUTCOME: ${{ steps.production.outcome }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/eas-update-report.mjs
