name: EAS Update

on:
  workflow_run:
    workflows: ["Convex Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip a commit a newer merge has replaced
        id: current
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" = "$DEPLOYED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now ${main_sha}; ${DEPLOYED_SHA} is superseded, so its own Convex Deploy run will publish the update."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.current.outputs.publish == 'true'

      - name: Set up EAS
        if: steps.current.outputs.publish == 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Publish to the production channel
        if: steps.current.outputs.publish == 'true'
        env:
          EXPO_PUBLIC_CONVEX_URL: https://giant-bloodhound-191.ap-southeast-2.convex.cloud
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL"
          eas update --channel production --environment production --auto --non-interactive

      - name: Publish to the staging channel
        if: steps.current.outputs.publish == 'true'
        env:
          APP_VARIANT: staging
          EXPO_PUBLIC_CONVEX_URL: https://successful-lynx-56.ap-southeast-2.convex.cloud
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL"
          eas update --channel staging --environment preview --auto --non-interactive
