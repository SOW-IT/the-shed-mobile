name: EAS Staging

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build"
        type: choice
        options: [both, ios, android]
        default: both
      force:
        description: "Build even if main's native code matches the last store build (otherwise it's sent over the air)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eas-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging:
    name: Build & submit → Staging
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Skip platforms whose native code matches the last store build
        id: fingerprint
        env:
          PLATFORM_INPUT: ${{ inputs.platform || 'both' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node scripts/eas-fingerprint-check.mjs staging

      - name: Publish over the air instead of building
        if: steps.fingerprint.outputs.update_platform != 'none'
        env:
          UPDATE_PLATFORM: ${{ steps.fingerprint.outputs.update_platform }}
          CHANNEL: ${{ steps.fingerprint.outputs.channel }}
          APP_VARIANT: staging
          EXPO_PUBLIC_CONVEX_URL: https://successful-lynx-56.ap-southeast-2.convex.cloud
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL"
          eas update --channel "$CHANNEL" --environment preview --platform "$UPDATE_PLATFORM" --auto --non-interactive

      - name: Build & submit to staging
        if: steps.fingerprint.outputs.eas_platform != 'none'
        env:
          EAS_PLATFORM: ${{ steps.fingerprint.outputs.eas_platform }}
        run: eas build --platform "$EAS_PLATFORM" --profile staging --non-interactive --auto-submit
