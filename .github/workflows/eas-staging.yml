name: EAS Staging

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build"
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: read

concurrency:
  group: eas-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging:
    name: Build & submit → Staging
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Resolve platform
        run: |
          platform="${{ inputs.platform || 'both' }}"
          [ "$platform" = "both" ] && platform="all"
          echo "EAS_PLATFORM=$platform" >> "$GITHUB_ENV"

      - name: Build & submit to staging
        run: eas build --platform "${{ env.EAS_PLATFORM }}" --profile staging --non-interactive --auto-submit
