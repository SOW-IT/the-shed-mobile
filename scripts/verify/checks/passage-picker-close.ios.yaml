# Flicks the devotional Book picker and closes it while the list is still
# gliding: the close button, then the backdrop. Then it closes it with a swipe
# down on the header, and by pulling the list down past its top. verify runs
# it after the route flow, signed in as the admin, with DEVOTIONAL_DATE and OUT.
appId: au.org.sow.theshed
---
- openLink: "theshedmobile://devotionals/${DEVOTIONAL_DATE}"
- extendedWaitUntil:
    visible:
      id: devotional-passage-book
    timeout: 20000

# Close button while the list glides.
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
- tapOn:
    id: sheet-close
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-close-button"
- assertNotVisible:
    id: sheet-list

# Backdrop while the list glides.
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
- tapOn:
    point: "50%, 6%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-backdrop"
- assertNotVisible:
    id: sheet-list

# A swipe down on the header.
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-header
    timeout: 5000
- swipe:
    from:
      id: sheet-header
    direction: DOWN
- takeScreenshot: "${OUT}/check-header-swipe"
- assertNotVisible:
    id: sheet-list

# Pulling the list down past its top.
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 35%"
    end: "50%, 85%"
    duration: 600
- takeScreenshot: "${OUT}/check-pull-down"
- assertNotVisible:
    id: sheet-list
