appId: au.org.sow.theshed
---
- openLink: "theshedmobile://devotionals/${DEVOTIONAL_EMPTY_DATE}"
- extendedWaitUntil:
    visible:
      id: devotional-passage-book
    timeout: 20000
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
- tapOn:
    id: sheet-close
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-book-close-button"
- assertNotVisible:
    id: sheet-list
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
# The backdrop above the sheet. Not higher: iOS keeps taps on the status bar
# (about the top 7% on an iPhone with a Dynamic Island) for itself, so a tap
# at 6% never reached the app, even with the list still. The sheet's top sits
# at 15% or lower, as it's centred and at most 70% tall.
- tapOn:
    point: "50%, 11%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-book-backdrop"
- assertNotVisible:
    id: sheet-list
# The backdrop below the sheet, also while the list glides.
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
- tapOn:
    point: "50%, 91%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-book-backdrop-below"
- assertNotVisible:
    id: sheet-list
# A swipe down on the header while the list glides.
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-header
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
- swipe:
    from:
      id: sheet-header
    direction: DOWN
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-header-swipe"
- assertNotVisible:
    id: sheet-list
- tapOn:
    id: devotional-passage-book
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 35%"
    end: "50%, 85%"
    duration: 600
- takeScreenshot: "${OUT}/check-pull-down"
- assertNotVisible:
    id: sheet-list
- tapOn:
    id: devotional-passage-book
- tapOn: "Search books"
- inputText: "Psal"
# A book row reads "Psalms, 150 chapters", and Maestro matches the whole label.
- tapOn: "Psalms.*"
- extendedWaitUntil:
    visible:
      id: passage-chapter-1
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
- tapOn:
    id: sheet-close
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-chapter-close-button"
- assertNotVisible:
    id: sheet-list
- tapOn:
    id: devotional-passage-chapter
- scrollUntilVisible:
    element:
      id: passage-chapter-119
    direction: DOWN
- tapOn:
    id: passage-chapter-119
- assertNotVisible:
    id: sheet-list
- tapOn:
    id: devotional-passage-from
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 5000
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 120
    waitToSettleTimeoutMs: 1
- tapOn:
    id: sheet-close
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1
- takeScreenshot: "${OUT}/check-verse-close-button"
- assertNotVisible:
    id: sheet-list
