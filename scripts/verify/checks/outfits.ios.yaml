appId: au.org.sow.theshed
---
# The character editor's outfits: sleeves (short and long), the new tops,
# and the "any colour" picker under the top's colour row. Nothing is saved,
# so the look the other checks see doesn't change.
- openLink: "theshedmobile://world?sheet=character"
- extendedWaitUntil:
    visible:
      id: world-editor
    timeout: 60000
- tapOn:
    id: world-editor-tab-outfit
# Sleeves on a collared shirt: short, then long. The choices scroll under
# the preview and the tabs, so each scroll is a short swipe inside the list
# (from 80% to 58% of the screen): the middle of the screen is the tabs,
# which don't scroll, so scrollUntilVisible's swipe never moved the list.
- tapOn:
    id: world-editor-outfit-6
- repeat:
    while:
      notVisible:
        id: world-editor-sleeves-2
    times: 12
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- tapOn:
    id: world-editor-sleeves-1
- takeScreenshot: "${OUT}/check-outfits-collared-short"
- tapOn:
    id: world-editor-sleeves-2
- takeScreenshot: "${OUT}/check-outfits-collared-long"
# The new tops: a tank top (no sleeves choice), a sailor top, a sweater
# vest, a sundress, a jumpsuit and a Hawaiian shirt.
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-12
    times: 12
    commands:
      - swipe:
          start: "50%, 58%"
          end: "50%, 80%"
          duration: 400
- tapOn:
    id: world-editor-outfit-12
- assertNotVisible:
    id: world-editor-sleeves-0
- takeScreenshot: "${OUT}/check-outfits-tank-top"
# Into view either way: picking a top that has its own bottoms (or no
# sleeves) drops rows below, and the list's scroll moves.
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-13
    times: 4
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-13
    times: 8
    commands:
      - swipe:
          start: "50%, 58%"
          end: "50%, 80%"
          duration: 400
- tapOn:
    id: world-editor-outfit-13
- takeScreenshot: "${OUT}/check-outfits-sailor-top"
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-14
    times: 4
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-14
    times: 8
    commands:
      - swipe:
          start: "50%, 58%"
          end: "50%, 80%"
          duration: 400
- tapOn:
    id: world-editor-outfit-14
- takeScreenshot: "${OUT}/check-outfits-sweater-vest"
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-15
    times: 4
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-15
    times: 8
    commands:
      - swipe:
          start: "50%, 58%"
          end: "50%, 80%"
          duration: 400
- tapOn:
    id: world-editor-outfit-15
- takeScreenshot: "${OUT}/check-outfits-sundress"
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-16
    times: 4
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-16
    times: 8
    commands:
      - swipe:
          start: "50%, 58%"
          end: "50%, 80%"
          duration: 400
- tapOn:
    id: world-editor-outfit-16
- takeScreenshot: "${OUT}/check-outfits-jumpsuit"
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-17
    times: 4
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- repeat:
    while:
      notVisible:
        id: world-editor-outfit-17
    times: 8
    commands:
      - swipe:
          start: "50%, 58%"
          end: "50%, 80%"
          duration: 400
- tapOn:
    id: world-editor-outfit-17
- takeScreenshot: "${OUT}/check-outfits-hawaiian-shirt"
# Any colour: the picker opens under the row, and a typed hex colours the top.
- repeat:
    while:
      notVisible:
        id: world-editor-shirt-custom
    times: 12
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- tapOn:
    id: world-editor-shirt-custom
# The picker's sliders take any drag that starts on them (so a colour drags
# from anywhere on its thumb), and the list doesn't scroll under them. The
# swipe at the middle landed on a slider, so the hex box never came up and
# the check ran out of verify's 5 minutes here. Each picker row starts with
# its name ("Hue", "Hex") at the left, which takes no touches, so this
# swipe starts there.
- repeat:
    while:
      notVisible:
        id: world-editor-shirt-hex
    times: 6
    commands:
      - swipe:
          start: "12%, 80%"
          end: "12%, 58%"
          duration: 400
- tapOn:
    id: world-editor-shirt-hex
- eraseText: 10
- inputText: "#3A9AD9"
# No hideKeyboard (about 30 s here): the preview at the top shows the
# colour with the keyboard up, and ✕ closes the editor either way.
- takeScreenshot: "${OUT}/check-outfits-colour-picker"
- tapOn:
    id: world-editor-close
