appId: au.org.sow.theshed
---
# Every eye shape in the character editor: each tile is tapped in turn and
# the editor (its preview and the tiles) is shot. Then the last one is saved
# and the World is shot with it. The base's run stops at the first tile it
# doesn't have, so its "before" warns.
- openLink: "theshedmobile://world?sheet=character"
- extendedWaitUntil:
    visible:
      id: world-editor
    timeout: 60000
- tapOn:
    id: world-editor-tab-eyes
- extendedWaitUntil:
    visible:
      id: world-editor-eyes-0
    timeout: 10000
- takeScreenshot: "${OUT}/check-eyes-tiles"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-0
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-0
- takeScreenshot: "${OUT}/check-eyes-00-dots"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-1
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-1
- takeScreenshot: "${OUT}/check-eyes-01-round"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-2
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-2
- takeScreenshot: "${OUT}/check-eyes-02-sleepy"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-3
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-3
- takeScreenshot: "${OUT}/check-eyes-03-sparkly"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-4
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-4
- takeScreenshot: "${OUT}/check-eyes-04-wide"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-5
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-5
- takeScreenshot: "${OUT}/check-eyes-05-narrow"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-6
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-6
- takeScreenshot: "${OUT}/check-eyes-06-lashes"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-7
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-7
- takeScreenshot: "${OUT}/check-eyes-07-almond"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-8
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-8
- takeScreenshot: "${OUT}/check-eyes-08-cat"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-9
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-9
- takeScreenshot: "${OUT}/check-eyes-09-puppy"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-10
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-10
- takeScreenshot: "${OUT}/check-eyes-10-starry"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-11
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-11
- takeScreenshot: "${OUT}/check-eyes-11-hearts"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-12
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-12
- takeScreenshot: "${OUT}/check-eyes-12-tiny"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-13
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-13
- takeScreenshot: "${OUT}/check-eyes-13-anime"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-14
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-14
- takeScreenshot: "${OUT}/check-eyes-14-wink"
- scrollUntilVisible:
    element:
      id: world-editor-eyes-15
    direction: DOWN
    centerElement: true
- tapOn:
    id: world-editor-eyes-15
- takeScreenshot: "${OUT}/check-eyes-15-sharp"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible:
      id: world-editor
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: world-stage
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "${OUT}/check-eyes-saved-world"
