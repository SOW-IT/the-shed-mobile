appId: au.org.sow.theshed
---
# Every eye shape in the character editor: each tile is tapped in turn and
# the editor (its preview and the tiles) is shot. Nothing is saved, so the
# look the other checks and the screen sweep see doesn't change; the web
# check covers saving. The base's run stops at the first tile it doesn't
# have, so its "before" warns.
- openLink: "theshedmobile://world?sheet=character"
- extendedWaitUntil:
    visible:
      id: world-editor
    timeout: 60000
- tapOn:
    id: world-editor-tab-eyes
- extendedWaitUntil:
    visible:
      id: world-editor-eyes-0
    timeout: 10000
- takeScreenshot: "${OUT}/check-eyes-tiles"
# The tiles scroll under the preview and the tabs, so each scroll is a short
# swipe inside the list (from 80% to 58% of the screen), as in outfits.ios.yaml:
# the middle of the screen is the tabs, which don't scroll, so
# scrollUntilVisible's swipe never moves the list.
- repeat:
    while:
      notVisible:
        id: world-editor-eyes-0
    times: 12
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 58%"
          duration: 400
- tapOn:
    id: world-editor-eyes-0
- takeScreenshot: "${OUT}/check-eyes-00-dots"
- repeat:
    while:
      notVisible:
