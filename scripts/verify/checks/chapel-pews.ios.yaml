appId: au.org.sow.theshed
---
# Into the Chapel, onto a pew, then to the lectern, screenshotting each.
# Screenshots come first and the one assertion that differs from main comes
# last, so the before run (soft) still takes every shot.
#
# The World's accessible targets don't take touches themselves: tapping one
# by its label lands on the scene under it, as a finger would. The pew has
# no target, so it's a point: the front left pew's middle seat on a 402 by
# 874 screen (25%, 61%; Garden.tsx's camera, FOCUS { x: 0, z: -2.6 }).
- openLink: "theshedmobile://world"
- extendedWaitUntil:
    visible:
      id: world-title
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
# The Garden's pad to the Chapel.
- tapOn: "Go to The Chapel"
- extendedWaitUntil:
    visible: "Lectern.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "${OUT}/check-chapel"
# Sit on a pew.
- tapOn:
    point: "25%, 61%"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: "${OUT}/check-pew-seated"
- runFlow:
    when:
      visible:
        id: world-devotional-dialog
    commands:
      - tapOn:
          id: world-devotional-cancel
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "${OUT}/check-pew-seated-closed"
# Tap the lectern.
- tapOn: "Lectern.*"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: "${OUT}/check-lectern"
- runFlow:
    when:
      visible:
        id: world-devotional-dialog
    commands:
      - tapOn:
          id: world-devotional-cancel
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "${OUT}/check-lectern-closed"
# A tap while you stand at the lectern asks about Devotionals, then and now.
- tapOn: "Lectern.*"
- extendedWaitUntil:
    visible:
      id: world-devotional-dialog
    timeout: 10000
- takeScreenshot: "${OUT}/check-lectern-again"
- tapOn:
    id: world-devotional-cancel
- waitForAnimationToEnd:
    timeout: 3000
# New: sitting on a pew no longer asks about Devotionals.
- tapOn:
    point: "25%, 61%"
- waitForAnimationToEnd:
    timeout: 15000
- assertNotVisible:
    id: world-devotional-dialog
