appId: au.org.sow.theshed
---
# In the Chapel: a pew sits you without asking about Devotionals, the
# lectern stands you behind it facing the room, and a second tap there asks.
#
# The World's accessible targets don't take touches themselves: tapping one
# by its label lands on the scene under it, as a finger would. The pew has
# no target, so it's a point: the front left pew's middle seat, 25% across
# and 61% down (Garden.tsx's camera, FOCUS { x: 0, z: -2.6 }). "world-me"
# is you, labelled with how you're placed (myPose.ts).
- openLink: "theshedmobile://world"
- extendedWaitUntil:
    visible:
      id: world-title
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Go to The Chapel"
- extendedWaitUntil:
    visible: "Lectern.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "${OUT}/check-chapel-arrived"
# A pew: seated, and nothing asks about Devotionals.
- tapOn:
    point: "25%, 61%"
- extendedWaitUntil:
    visible:
      id: world-me
      text: "You, sitting"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-chapel-pew-seated"
- assertNotVisible:
    id: world-devotional-dialog
# The lectern: behind it, facing the room, and nothing asks yet.
- tapOn: "Lectern.*"
- extendedWaitUntil:
    visible:
      id: world-me
      text: "You, behind the lectern, facing the room"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-chapel-lectern"
- assertNotVisible:
    id: world-devotional-dialog
# Again, standing there: Devotionals asks.
- tapOn: "Lectern.*"
- extendedWaitUntil:
    visible:
      id: world-devotional-dialog
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-chapel-lectern-again"
- tapOn:
    id: world-devotional-cancel
