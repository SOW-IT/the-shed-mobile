appId: au.org.sow.theshed
---
# Mahjong on iOS, one person and three bots: to the Café, sit at Table 2's
# East stool, the lobby opens (the arcade list's panel), the host adds a bot
# to each other seat and starts, and the table opens full screen with the
# dice, then the dealt hand. Starting counts down 3 seconds first (bots are
# always ready). At the table, the timer runs under ✕ and the table's options
# open as a settings card. The web check (three people) runs first on this
# backend and uses Table 1, so this one sits at Table 2.
#
# Each stool is a VoiceOver target: "Mahjong Table 2, East seat".
#
# The World never stops moving (people walking, the animals), so after a tap
# there Maestro would wait up to about 45 s for the screen to settle, and the
# check ran past verify's 5 minutes. The World's taps cap that wait at 2 s
# (waitToSettleTimeoutMs); the waits after each tap say what to wait for.
- openLink: "theshedmobile://world"
- extendedWaitUntil:
    visible:
      id: world-title
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: world-title
        text: "(?i).*caf.*"
    commands:
      # Through the menu to the Garden only when somewhere else: in the Garden already, the menu stays shut (on
      # main a tap meant for the Café's pad kept landing on the menu's Settings row).
      - runFlow:
          when:
            notVisible:
              id: world-title
              text: "(?i).*garden.*"
          commands:
            - tapOn:
                id: world-title
                waitToSettleTimeoutMs: 2000
            - waitForAnimationToEnd:
                timeout: 2000
            - runFlow:
                when:
                  visible:
                    id: world-menu-garden
                commands:
                  - tapOn:
                      id: world-menu-garden
                      waitToSettleTimeoutMs: 2000
            - runFlow:
                when:
                  visible:
                    id: world-menu-close
                commands:
                  - tapOn:
                      id: world-menu-close
                      waitToSettleTimeoutMs: 2000
            - extendedWaitUntil:
                visible:
                  id: world-title
                  text: "(?i).*garden.*"
                timeout: 30000
      # A panel left open (the arcade's, by its cabinet) covers the Café's pad; shut it first.
      - runFlow:
          when:
            visible:
              id: world-arcade-close
          commands:
            - tapOn:
                id: world-arcade-close
                waitToSettleTimeoutMs: 2000
            - extendedWaitUntil:
                notVisible:
                  id: world-arcade-close
                timeout: 5000
      - extendedWaitUntil:
          visible: "Go to The Café"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Go to The Café"
          waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: world-title
      text: "(?i).*caf.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-mahjong-cafe"
# Standing by the café's arcade cabinet opens its panel, which covers Table 2's stools; shut it first.
- runFlow:
    when:
      visible:
        id: world-arcade-close
    commands:
      - tapOn:
          id: world-arcade-close
          waitToSettleTimeoutMs: 2000
      - extendedWaitUntil:
          notVisible:
            id: world-arcade-close
          timeout: 5000
- tapOn: "Mahjong Table 2, East seat"
- extendedWaitUntil:
    visible:
      id: mahjong-lobby
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-mahjong-lobby"
- tapOn:
    id: mahjong-add-bot-1
- tapOn:
    id: mahjong-add-bot-2
- tapOn:
    id: mahjong-add-bot-3
- extendedWaitUntil:
    visible:
      id: mahjong-remove-bot-3
    timeout: 15000
- takeScreenshot: "${OUT}/check-mahjong-lobby-full"
# The lobby sits just above the chat box with the chat log in view (the screenshot shows it); the rules open in a
# dialog of their own and ✕ closes it. The World behind keeps moving, so these taps don't wait for it to settle.
- tapOn:
    id: mahjong-rules-change
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: mahjong-rules-done
    timeout: 5000
- takeScreenshot: "${OUT}/check-mahjong-rules"
- tapOn:
    id: mahjong-rules-close
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    notVisible:
      id: mahjong-rules-done
    timeout: 5000
- takeScreenshot: "${OUT}/check-mahjong-rules-closed"
- tapOn:
    id: mahjong-start
- extendedWaitUntil:
    visible:
      id: mahjong-countdown
    timeout: 5000
- takeScreenshot: "${OUT}/check-mahjong-countdown"
- extendedWaitUntil:
    visible:
      id: mahjong-table
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: "${OUT}/check-mahjong-dice"
- extendedWaitUntil:
    visible:
      id: mahjong-compass
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${OUT}/check-mahjong-table"
- extendedWaitUntil:
    visible:
      id: mahjong-timer
    timeout: 30000
- takeScreenshot: "${OUT}/check-mahjong-timer"
- tapOn:
    id: mahjong-options
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: mahjong-options-panel
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${OUT}/check-mahjong-options"
# The open options are modal (VoiceOver and Maestro only see the panel), so
# they close with their ✕, not the Options button behind them.
- tapOn:
    id: mahjong-options-x
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    notVisible:
      id: mahjong-options-panel
    timeout: 10000
# Leave the table: it asks first (a bot plays your seat), then a bot takes
# the seat, and the World is back.
- tapOn:
    id: mahjong-leave
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: mahjong-give-up-confirm
    timeout: 10000
- takeScreenshot: "${OUT}/check-mahjong-leave-question"
- tapOn:
    id: mahjong-give-up-confirm
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: mahjong-sit-back
    timeout: 15000
- takeScreenshot: "${OUT}/check-mahjong-sit-back"
