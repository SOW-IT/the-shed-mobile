appId: au.org.sow.theshed
---
# Hop on a phone: the start card and its characters, the leave dialog and
# Continue on a run, holding the left half to start and steer and sliding
# across the middle to turn round, then a run that plays itself (test builds
# only) to the fall-off ending, Play again, and the Leaderboard.
# Read the screenshots: the page, the character and the cards.
- openLink: "theshedmobile://games"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 30000
- tapOn:
    id: games-open-hop
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-hop-start"
- tapOn:
    id: character-sij
- takeScreenshot: "${OUT}/check-hop-sij"
- tapOn:
    id: character-original
# Back to the Games list (no run yet, so it doesn't ask), so the links below
# open Hop fresh and leaving comes back to the list.
- tapOn: "Back to the games"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 20000
# A run that plays itself, climbing far past where this check stops it, so
# it's still going while the back button asks first and waits.
- openLink: "theshedmobile://games/hop?autoplay=5000"
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- tapOn:
    id: game-play-area
    retryTapIfNoChange: false
- assertNotVisible:
    id: character-picker-hop
- tapOn: "Back to the games"
- extendedWaitUntil:
    visible: "Leave this game?"
    timeout: 10000
- takeScreenshot: "${OUT}/check-hop-leave"
- tapOn: "Continue"
- extendedWaitUntil:
    notVisible: "Leave this game?"
    timeout: 10000
- tapOn: "Back to the games"
- extendedWaitUntil:
    visible: "Leave this game?"
    timeout: 10000
- tapOn: "Leave game"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 20000
# A new run: hold the left half to start and steer left, then slide to the
# right half without lifting. Steering off the first platform can miss the
# rest and fall off, so either way the run is left after.
- tapOn:
    id: games-open-hop
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- swipe:
    start: "20%, 75%"
    end: "80%, 75%"
    duration: 1500
- assertNotVisible:
    id: character-picker-hop
- takeScreenshot: "${OUT}/check-hop-steered"
- tapOn: "Back to the games"
- runFlow:
    when:
      visible: "Leave this game?"
    commands:
      - tapOn: "Leave game"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 20000
# A run that plays itself to 400 and falls off.
- openLink: "theshedmobile://games/hop?autoplay=400"
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- tapOn:
    id: game-play-area
    retryTapIfNoChange: false
# The drawing takes no touches, so it isn't in the accessibility tree to
# wait on. The board never stops moving, so this waits the full 1.5 s: a
# moment's climb, then a look.
- assertNotVisible:
    id: character-picker-hop
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "${OUT}/check-hop-climbing"
- extendedWaitUntil:
    visible:
      id: game-over-back
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-hop-game-over"
- assertVisible: "Practice run. Not saved."
- tapOn: "Play again"
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 10000
- openLink: "theshedmobile://games/leaderboard?game=hop"
- extendedWaitUntil:
    visible:
      id: leaderboard-page-hop
    timeout: 20000
- takeScreenshot: "${OUT}/check-hop-leaderboard"
