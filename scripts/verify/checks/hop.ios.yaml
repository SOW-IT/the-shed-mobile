appId: au.org.sow.theshed
---
# Hop on a phone: the start card and its characters, the propeller hat on
# Sij's and the Doodle Hopper's heads, the leave dialog and
# Continue on a run, holding the left half to start and steer and sliding
# across the middle to turn round, holding each side and quick taps either
# side, then a run that plays itself (test builds
# only) to the fall-off ending, Play again, and the Leaderboard.
# Read the screenshots: the page, the character and the cards.
- openLink: "theshedmobile://games"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 30000
- tapOn:
    id: games-open-hop
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-hop-start"
- tapOn:
    id: character-sij
- takeScreenshot: "${OUT}/check-hop-sij"
# The propeller hat on Sij's head (in place of the party hat), facing right
# and left (test builds only). Read these: the cap sits on the head.
- openLink: "theshedmobile://games/hop?preview=propeller"
- extendedWaitUntil:
    visible:
      id: game-play-area
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-hop-propeller-sij"
- openLink: "theshedmobile://games/hop?preview=propellerleft"
- extendedWaitUntil:
    visible:
      id: game-play-area
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-hop-propeller-left-sij"
- openLink: "theshedmobile://games/hop"
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- tapOn:
    id: character-original
# And on the Doodle Hopper's.
- openLink: "theshedmobile://games/hop?preview=propeller"
- extendedWaitUntil:
    visible:
      id: game-play-area
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-hop-propeller-original"
# Back to the Games list, so the links below open Hop fresh and leaving comes
# back to the list.
- openLink: "theshedmobile://games"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 20000
# A run that plays itself, climbing far past where this check stops it, so
# it's still going while the back button asks first and waits.
- openLink: "theshedmobile://games/hop?autoplay=5000"
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- tapOn:
    id: game-play-area
    retryTapIfNoChange: false
- assertNotVisible:
    id: character-picker-hop
- tapOn: "Back to the games"
- extendedWaitUntil:
    visible: "Leave this game?"
    timeout: 10000
- takeScreenshot: "${OUT}/check-hop-leave"
- tapOn: "Continue"
- extendedWaitUntil:
    notVisible: "Leave this game?"
    timeout: 10000
- tapOn: "Back to the games"
- extendedWaitUntil:
    visible: "Leave this game?"
    timeout: 10000
- tapOn: "Leave game"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 20000
# A new run: hold the left half to start and steer left, then slide to the
# right half without lifting. Steering off the first platform can miss the
# rest and fall off, so either way the run is left after.
- tapOn:
    id: games-open-hop
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- swipe:
    start: "20%, 75%"
    end: "80%, 75%"
    duration: 1500
- assertNotVisible:
    id: character-picker-hop
- takeScreenshot: "${OUT}/check-hop-steered"
# Each side held, then let go, then quick taps either side: every touch
# steers at once and letting go stops you. Read these: the character is
# still on the board, nearer the side last held.
# Only while the run is still going: steering off the first platform can
# fall off, and these taps would land on the game-over card.
- runFlow:
    when:
      notVisible:
        id: game-over-back
    commands:
      - longPressOn:
          point: "20%, 75%"
      - takeScreenshot: "${OUT}/check-hop-held-left"
      - longPressOn:
          point: "80%, 75%"
      - takeScreenshot: "${OUT}/check-hop-held-right"
      - tapOn:
          point: "20%, 75%"
          retryTapIfNoChange: false
      - tapOn:
          point: "80%, 75%"
          retryTapIfNoChange: false
      - tapOn:
          point: "20%, 75%"
          retryTapIfNoChange: false
      - tapOn:
          point: "80%, 75%"
          retryTapIfNoChange: false
      - takeScreenshot: "${OUT}/check-hop-quick-taps"
- tapOn: "Back to the games"
- runFlow:
    when:
      visible: "Leave this game?"
    commands:
      - tapOn: "Leave game"
- extendedWaitUntil:
    visible:
      id: games-open-hop
    timeout: 20000
# A run that plays itself to 400 and falls off.
- openLink: "theshedmobile://games/hop?autoplay=400"
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 30000
- tapOn:
    id: game-play-area
    retryTapIfNoChange: false
# The drawing takes no touches, so it isn't in the accessibility tree to
# wait on. The board never stops moving, so this waits the full 1.5 s: a
# moment's climb, then a look.
- assertNotVisible:
    id: character-picker-hop
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "${OUT}/check-hop-climbing"
- extendedWaitUntil:
    visible:
      id: game-over-back
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-hop-game-over"
- assertVisible: "Practice run. Not saved."
- tapOn: "Play again"
- extendedWaitUntil:
    visible:
      id: character-picker-hop
    timeout: 10000
- openLink: "theshedmobile://games/leaderboard?game=hop"
- extendedWaitUntil:
    visible:
      id: leaderboard-page-hop
    timeout: 20000
- takeScreenshot: "${OUT}/check-hop-leaderboard"
