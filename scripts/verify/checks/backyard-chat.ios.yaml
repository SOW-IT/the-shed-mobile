appId: au.org.sow.theshed
---
# The World's chat in the backyard: the chat box is there, what you say shows
# in the log, and out in the Garden the line is still there, tagged
# [Backyard]. Then back into the backyard, and the chat is there again.
#
# The World never stops moving (people walking, the animals), so after a tap
# there Maestro would wait up to about 45 s for the screen to settle, and the
# check ran past verify's 5 minutes. The World's taps cap that wait at 2 s
# (waitToSettleTimeoutMs); the waits after each tap say what to wait for.
# The menu opens through flows/open-world-menu.yaml, which makes sure it did.
#
# A chat line's label is what it says and where it was said ("You said …,
# in Backyard") (view.ts saidLabel). The web check (two people) runs first
# on this backend and account, so you may already be in the backyard.
- openLink: "theshedmobile://world"
- extendedWaitUntil:
    visible:
      id: world-title
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: world-title
        text: ".*backyard.*"
    commands:
      - runFlow: flows/open-world-menu.yaml
      # The menu's Backyard row takes you there (through your home, from
      # anywhere else). Closing the menu with ✕ and walking to the home's
      # Backyard pad raced it: a ✕ tap while the menu is still opening can
      # miss, and the open menu then takes the tap meant for the pad.
      - extendedWaitUntil:
          visible:
            id: world-menu-backyard
          timeout: 10000
      - tapOn:
          id: world-menu-backyard
          waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: world-title
      text: ".*backyard.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: world-chat-input
- takeScreenshot: "${OUT}/check-backyard-chat-arrived"
# Talking in the backyard.
- tapOn:
    id: world-chat-input
    waitToSettleTimeoutMs: 2000
- inputText: "Hello from the backyard on iOS"
- tapOn:
    id: world-send
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible: "You said Hello from the backyard on iOS"
    timeout: 15000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-backyard-chat-said"
# Out to the Garden: the line is still there, tagged [Backyard].
- runFlow: flows/open-world-menu.yaml
- tapOn:
    id: world-menu-garden
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: world-title
      text: ".*Garden.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "You said Hello from the backyard on iOS, in Backyard"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-backyard-chat-garden"
# And back in: the chat box and the line are there again.
- runFlow:
    commands:
      - runFlow: flows/open-world-menu.yaml
      # By the menu's Backyard row again.
      - extendedWaitUntil:
          visible:
            id: world-menu-backyard
          timeout: 10000
      - tapOn:
          id: world-menu-backyard
          waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: world-title
      text: ".*backyard.*"
    timeout: 30000
- assertVisible:
    id: world-chat-input
- extendedWaitUntil:
    visible: "You said Hello from the backyard on iOS, in Backyard"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${OUT}/check-backyard-chat-back"
# Back to the Garden, where the checks after this one expect to start.
- runFlow: flows/open-world-menu.yaml
- tapOn:
    id: world-menu-garden
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: world-title
      text: ".*Garden.*"
    timeout: 30000
