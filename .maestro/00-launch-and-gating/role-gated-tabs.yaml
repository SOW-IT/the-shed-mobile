# §0 Role-gated tab bar and side menu for signed-in roles. Needs seeded accounts.
#   - campus leader: Attendance tab; no Reimbursements in the side menu
#   - plain staff:   Attendance, Insights, Org Chart tabs; Reimbursements in the
#                    side menu (it's no longer a tab); no Admin
#   - admin/Finance Head: Admin in the side menu
# Insights icon shows the BETA flag for everyone.
#
# iOS tab labels are "<Name>, tab, N of N" — never match the bare title.
appId: ${APP_ID}
tags:
  - staff
  - admin
---
# ── Campus leader ────────────────────────────────────────────────────────────
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${CAMPUS_LEADER_EMAIL}
      PASSWORD: ${CAMPUS_LEADER_PASSWORD}
- tapOn:
    text: ".*Attendance, tab.*"
- assertVisible: "Events"
- assertVisible:
    text: ".*Org Chart, tab.*"
- assertVisible:
    text: ".*Insights, tab.*"
- runFlow: ../common/open-menu.yaml
- assertVisible: "Profile"
- assertNotVisible:
    text: "Reimbursements.*"
- runFlow: ../common/sign-out-e2e.yaml

# ── Plain staff ──────────────────────────────────────────────────────────────
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
- assertNotVisible:
    text: ".*(Requests|Reimbursements), tab.*"
- assertVisible:
    text: ".*Attendance, tab.*"
- assertVisible:
    text: ".*Insights, tab.*"
- assertVisible:
    text: ".*Org Chart, tab.*"
- runFlow: ../common/open-menu.yaml
- assertVisible: "Profile"
- assertVisible:
    text: "Reimbursements.*"
- assertNotVisible: "Admin"
- runFlow: ../common/sign-out-e2e.yaml

# ── Finance Head: Admin in the side menu ─────────────────────────────────────
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}
- runFlow: ../common/open-menu.yaml
- assertVisible: "Admin"
