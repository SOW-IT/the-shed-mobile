# §0 Role-gated tab bar for signed-in roles. Needs seeded accounts.
#   - campus leader: no Requests tab; Attendance is available
#   - plain staff:   Requests, Attendance, Insights, Org Chart
#   - admin/Finance Head: "Open admin tools" bar visible on Org Chart
# Insights icon shows the BETA flag for everyone.
#
# iOS tab labels are "<Name>, tab, N of N" — never match the bare title.
appId: ${APP_ID}
tags:
  - staff
  - admin
---
# ── Campus leader ────────────────────────────────────────────────────────────
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${CAMPUS_LEADER_EMAIL}
      PASSWORD: ${CAMPUS_LEADER_PASSWORD}
- tapOn:
    text: ".*Attendance, tab.*"
- assertVisible: "Events"
- assertNotVisible:
    text: ".*Requests, tab.*"
- assertVisible:
    text: ".*Org Chart, tab.*"
- assertVisible:
    text: ".*Insights, tab.*"
- runFlow: ../common/sign-out-e2e.yaml

# ── Plain staff ──────────────────────────────────────────────────────────────
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
- assertVisible:
    text: ".*Requests, tab.*"
- assertVisible:
    text: ".*Attendance, tab.*"
- assertVisible:
    text: ".*Insights, tab.*"
- assertVisible:
    text: ".*Org Chart, tab.*"
- runFlow: ../common/sign-out-e2e.yaml

# ── Finance Head: admin bar on Org Chart ─────────────────────────────────────
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}
- tapOn:
    text: ".*Org Chart, tab.*"
- assertVisible:
    text: "Open admin tools"
