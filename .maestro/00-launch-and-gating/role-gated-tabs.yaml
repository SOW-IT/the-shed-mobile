appId: ${APP_ID}
tags:
  - staff
  - admin
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${CAMPUS_LEADER_EMAIL}
      PASSWORD: ${CAMPUS_LEADER_PASSWORD}
- tapOn:
    text: ".*Attendance, tab.*"
- assertVisible: "Events"
- assertVisible:
    text: ".*Org Chart, tab.*"
- assertVisible:
    text: ".*Insights, tab.*"
- runFlow: ../common/open-menu.yaml
- assertVisible: "Profile"
- assertNotVisible:
    text: "Requests.*"
- assertNotVisible: "Mentoring"
- runFlow: ../common/sign-out-e2e.yaml

- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
- assertNotVisible:
    text: ".*(Requests|Reimbursements), tab.*"
- assertVisible:
    text: ".*Attendance, tab.*"
- assertVisible:
    text: ".*Insights, tab.*"
- assertVisible:
    text: ".*Org Chart, tab.*"
- runFlow: ../common/open-menu.yaml
- assertVisible: "Profile"
- assertVisible:
    text: "Requests.*"
- assertNotVisible: "Mentoring"
- assertNotVisible: "Admin"
- runFlow: ../common/sign-out-e2e.yaml

- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}
- runFlow: ../common/open-menu.yaml
- assertVisible: "Admin"
- assertNotVisible: "Mentoring"
