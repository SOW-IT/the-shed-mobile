appId: ${APP_ID}
tags:
  - staff
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- runFlow: ../common/open-menu.yaml
- assertVisible: "Open your profile"
- assertVisible: "Profile"
- assertVisible:
    text: "Requests.*"
- runFlow:
    when:
      notVisible: "Reimbursements.*"
    commands:
      - tapOn: "Requests.*"
- assertVisible:
    text: "Reimbursements.*"
- assertVisible:
    text: "Event Requests.*"
- assertVisible:
    text: "Design Requests.*"
- tapOn: "Requests.*"
- assertNotVisible:
    text: "Reimbursements.*"

- tapOn:
    point: "92%,50%"
- assertNotVisible: "Sign out"

- swipe:
    start: "1%,50%"
    end: "75%,50%"
    duration: 400
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 5000

- swipe:
    start: "60%,50%"
    end: "5%,50%"
    duration: 300
- assertNotVisible: "Sign out"

- swipe:
    start: "50%,50%"
    end: "90%,50%"
    duration: 300
- assertNotVisible: "Sign out"

- runFlow: ../common/open-profile.yaml
- assertVisible: ${STAFF_EMAIL}
- runFlow: ../common/open-reimbursements.yaml
