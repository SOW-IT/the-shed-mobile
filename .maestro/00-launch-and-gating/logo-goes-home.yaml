# §0 Tapping the top-left "THE SHED" logo goes to the Home tab (not Requests),
# from any tab. As a visitor, verify from Insights and Org Chart.
appId: ${APP_ID}
tags:
  - public
---
- runFlow: ../common/ensure-signed-out.yaml

- tapOn:
    text: ".*Insights, tab.*"
# Visitor Insights has no "Insights" heading — iOS only exposes the tab label
# ("Insights, tab, N of N") and chart a11y labels like "All staff — tap to expand".
- extendedWaitUntil:
    visible:
      text: ".*All staff.*"
    timeout: 15000

# Logo → Home
- tapOn:
    text: "Go to Home"
- assertVisible:
    text: "Student Outreach to the World" # Home mission hero (§1.1)
