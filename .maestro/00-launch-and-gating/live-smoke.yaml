appId: ${APP_ID}
tags:
  - finance
  - smoke
---
- runFlow:
    file: ../common/sign-in-staff-to-requests.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}

- assertVisible:
    text: "Mine.*"
- assertVisible:
    text: ".*Review.*"
- assertVisible:
    text: "All.*"
- assertVisible:
    text: "Bank.*"
- assertVisible: "+ Make Request"

- assertVisible:
    text: ".*Notifications.*"
- assertVisible:
    text: "Open menu.*"

- tapOn:
    text: ".*Attendance, tab.*"
- assertVisible: "Events"
- assertVisible: "Members"
- tapOn:
    text: ".*Org Chart, tab.*"
- assertNotVisible:
    text: ".*(Requests|Reimbursements), tab.*"
- runFlow: ../common/open-reimbursements.yaml
- assertVisible: "+ Make Request"
