appId: ${APP_ID}
tags:
  - admin
  - smoke
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
      PASSWORD: ${DIRECTOR_PASSWORD}
- runFlow: ../common/open-admin.yaml

- assertVisible: "Users"
- assertVisible: "Structure"
- assertVisible: "Other"

- tapOn:
    text: "[0-9]{4}"
    optional: true
- assertVisible:
    text: ".*current.*"
    optional: true
- tapOn:
    text: "Close"
    optional: true
