appId: ${APP_ID}
tags:
  - admin
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
      PASSWORD: ${DIRECTOR_PASSWORD}
- runFlow: ../common/open-admin.yaml

- tapOn: "Structure"
- assertVisible:
    text: ".*Roles.*"
    optional: true
- assertVisible:
    text: "Managed by the app — can't be renamed or deleted"
    optional: true

- tapOn: "Other"
- assertVisible:
    text: ".*Budget Manager.*"
- assertVisible:
    text: ".*(Director Threshold|Threshold).*"
- assertVisible:
    text: ".*(Delegation|delegations).*"

- scrollUntilVisible:
    element:
      text: ".*Sync Directory Now.*"
    direction: DOWN
    optional: true
- assertVisible:
    text: ".*(last-sync|Last sync|Never synced).*"
    optional: true
