appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
- tapOn: "Members"

- assertVisible:
    text: "Open menu.*"

- scroll
- scroll
- assertNotVisible:
    text: "Open menu.*"

- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- assertVisible:
    text: "Open menu.*"
