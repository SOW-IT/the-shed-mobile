appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-requests.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- tapOn:
    text: "Comments"
- assertVisible:
    text: "Send comment"

- tapOn:
    text: ".*(Add a comment|Message|Write).*"
    optional: true
- inputText: "E2E comment"
- assertVisible:
    text: "Send comment"
- tapOn:
    text: "Send comment"
- extendedWaitUntil:
    visible:
      text: ".*E2E comment.*"
    timeout: 15000

- tapOn:
    text: "Add a reaction"
    optional: true
- tapOn:
    text: "Close"
    optional: true
