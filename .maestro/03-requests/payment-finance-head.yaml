# §3.7 Payment (Finance Head) — Ready to Pay → Mark as paid → PAID.
# Needs the Finance-Head account and a request in AWAITING PAYMENT.
appId: ${APP_ID}
tags:
  - finance
---
- runFlow:
    file: ../common/sign-in-staff-to-requests.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}
# "Ready to Pay" is part of the Review tab (the approver's queue), not All.
# Segment carries an unread-count badge (e.g. "Review, 8, 15"); match by prefix.
- tapOn:
    text: "Review.*"

# Shared-dev Review mixes live data with E2E fixtures. Ready-to-Pay sits
# below every pending-approval card. Nested pager scrollUntilVisible does
# not move this list — swipe it, then settle on the pay icon.
- repeat:
    times: 10
    commands:
      - swipe:
          start: "50%,78%"
          end: "50%,28%"
          duration: 180
- runFlow:
    when:
      notVisible: "Mark as paid"
    commands:
      - swipe:
          start: "50%,35%"
          end: "50%,70%"
          duration: 180
- assertVisible: "Mark as paid"

# The card's icon trigger is labelled "Mark as paid" (lowercase p); the
# PaySheet's confirm button is a distinct "Mark as Paid" (capital P) — no
# index needed, the two never collide.
- tapOn:
    text: "Mark as paid"
- assertVisible:
    text: ".*Pay Reimbursement.*"

# Paid ≤ 0 blocked.
- tapOn:
    text: ".*amount.*"
    optional: true
- inputText: "0"
- tapOn:
    text: "Mark as Paid"
- assertVisible: "The paid amount must be a positive number."

# Positive amount → PAID.
- tapOn:
    text: ".*amount.*"
- eraseText
- inputText: "42.50"
- tapOn:
    text: "Mark as Paid"
- extendedWaitUntil:
    visible:
      text: ".*(PAID|Paid).*"
    timeout: 15000
