appId: ${APP_ID}
tags:
  - finance
---
- runFlow:
    file: ../common/sign-in-staff-to-requests.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}
- tapOn:
    text: "Review.*"

- repeat:
    times: 10
    commands:
      - swipe:
          start: "50%,78%"
          end: "50%,28%"
          duration: 180
- runFlow:
    when:
      notVisible: "Mark as paid"
    commands:
      - swipe:
          start: "50%,35%"
          end: "50%,70%"
          duration: 180
- assertVisible: "Mark as paid"

- tapOn:
    text: "Mark as paid"
- assertVisible:
    text: ".*Pay Reimbursement.*"

- tapOn:
    text: ".*amount.*"
    optional: true
- inputText: "0"
- tapOn:
    text: "Mark as Paid"
- assertVisible: "Enter the amount that was paid."

- tapOn:
    text: ".*amount.*"
- eraseText
- inputText: "42.50"
- tapOn:
    text: "Mark as Paid"
- extendedWaitUntil:
    visible:
      text: ".*(PAID|Paid).*"
    timeout: 15000
