appId: ${APP_ID}
tags:
  - requests
  - finance
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${DIRECTOR_EMAIL}
      PASSWORD: ${DIRECTOR_PASSWORD}
- runFlow:
    file: ../common/open-deeplink.yaml
    env:
      PATH: "finance-settings"
- assertVisible:
    text: ".*Budget Manager.*"
- assertVisible:
    text: ".*Reimbursement Director threshold.*"
- scrollUntilVisible:
    element:
      text: ".*Approver delegation.*"
    direction: DOWN
- assertVisible:
    text: ".*Event Director threshold.*"
