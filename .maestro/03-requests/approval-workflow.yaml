appId: ${APP_ID}
tags:
  - approver
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${APPROVER_EMAIL}
      PASSWORD: ${APPROVER_PASSWORD}
- runFlow: ../common/open-reimbursements.yaml
- tapOn:
    text: "Review.*"

- assertVisible:
    text: ".*Awaiting Your.*Approval.*"

- tapOn:
    text: "Decline"
- tapOn:
    text: ".*(Decline|Confirm).*"
    index: 1
- assertVisible:
    text: ".*Please give a reason.*"
- tapOn:
    text: ".*reason.*"
    optional: true
- inputText: "E2E decline reason"
- tapOn:
    text: "Close"
    optional: true

- tapOn:
    text: "Approve"
- assertVisible:
    text: ".*(Approve|Confirm).*"
- tapOn:
    text: ".*(Approve|Confirm).*"
    index: 1

- extendedWaitUntil:
    visible: "Reviewed.*"
    timeout: 15000
