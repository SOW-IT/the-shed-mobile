appId: ${APP_ID}
tags:
  - finance
---
- runFlow:
    file: ../common/sign-in-staff-to-requests.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}

- assertVisible: "+ Make Request"

- swipe:
    direction: LEFT
- assertVisible: "Review.*"
- assertNotVisible:
    text: "+ Make Request"
    optional: true

- swipe:
    direction: RIGHT
- assertVisible: "Mine.*"
- assertVisible: "+ Make Request"

- tapOn: "Bank"
- assertVisible: "Bank"
