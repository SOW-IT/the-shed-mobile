appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-requests.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- scrollUntilVisible:
    element:
      text: "Nudge approver"
    direction: DOWN
    speed: 35
    optional: true
- tapOn:
    text: "Nudge approver"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true

- tapOn:
    text: "Bank"
    optional: true
- tapOn:
    text: "Mine.*"
    optional: true
- tapOn:
    text: "View more details"
    optional: true

- tapOn:
    text: "Delete or cancel request"
    optional: true
- assertVisible:
    text: ".*(Are you sure|Cancel request|Delete).*"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true

- tapOn:
    text: "Resubmit request"
    optional: true
