appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-requests.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- assertVisible:
    text: ".*(AWAITING RECEIPT|Awaiting Receipt).*"
- tapOn:
    text: "Submit receipt"
- assertVisible:
    text: ".*Submit Receipt.*"

- assertVisible:
    text: ".*BSB.*"

- tapOn:
    text: ".*Submit Receipt.*"
    index: 1
- scrollUntilVisible:
    element:
      text: ".*Fill in every field.*"
    direction: DOWN

- tapOn:
    text: "Close"
    optional: true
