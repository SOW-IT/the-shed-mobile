appId: ${APP_ID}
tags:
  - finance
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${FINANCE_EMAIL}
      PASSWORD: ${FINANCE_PASSWORD}
- runFlow: ../common/open-reimbursements.yaml
- extendedWaitUntil:
    visible:
      text: "Mine.*"
    timeout: 20000
- tapOn:
    text: "All.*"

- extendedWaitUntil:
    visible: "Ongoing"
    timeout: 15000
- assertVisible: "Completed"
- tapOn: "Completed"
- tapOn: "Ongoing"

- assertVisible:
    text: "Select year"
    optional: true

- scrollUntilVisible:
    element:
      text: "Download CSV"
    direction: DOWN
- tapOn:
    text: "Download CSV"
- assertVisible:
    text: ".*Export requests\\?.*"
- tapOn:
    text: "Cancel"

- runFlow:
    file: ../common/open-admin.yaml
    optional: true
- assertVisible:
    text: ".*Budget Manager.*"
    optional: true
