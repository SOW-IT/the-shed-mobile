appId: ${APP_ID}
tags:
  - public
---
- runFlow: ../common/ensure-signed-out.yaml
- tapOn:
    text: ".*Org Chart, tab.*"

- assertVisible:
    text: ".*(Director|No Director assigned).*"

- tapOn:
    text: "[0-9]{4}"
    optional: true
- tapOn:
    text: "Close"
    optional: true

- tapOn:
    id: "org-person"
    index: 0
    optional: true
- assertNotVisible: "Sign out"
- assertNotVisible: "Local church"
