appId: ${APP_ID}
tags:
  - auth
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- runFlow: ../common/open-menu.yaml
- tapOn: "Sign out"
- assertVisible:
    text: ".*(Are you sure|Sign out).*"
- tapOn: "Cancel"
- assertVisible: "Open your profile"

- tapOn: "Sign out"
- tapOn: "Sign out"
- assertVisible:
    text: ".*Org Chart.*"
- assertNotVisible:
    text: "Open menu.*"
- assertVisible: "Sign in"
