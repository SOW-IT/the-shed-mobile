appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- tapOn:
    text: "Export attendance"
- assertVisible:
    text: ".*(Export|Date range|Metadata).*"

- scrollUntilVisible:
    element:
      text: ".*Notes.*"
    direction: DOWN
    optional: true
- tapOn:
    text: "Close"
    optional: true
