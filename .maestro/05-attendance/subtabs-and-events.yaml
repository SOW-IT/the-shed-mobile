appId: ${APP_ID}
tags:
  - staff
  - smoke
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- assertVisible: "Events"
- assertVisible: "Members"
- assertVisible: "Tags"
- assertVisible: "Metadata"
- assertVisible: "Audit"

- tapOn:
    text: "E2E Test Campus"
    optional: true

- scrollUntilVisible:
    element:
      text: ".*Open.*Weekly Meeting.*"
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible:
        text: ".*Open.*Weekly Meeting.*"
    commands:
      - tapOn:
          text: ".*Open.*Weekly Meeting.*"
      - assertVisible:
          text: ".*signed in.*"
      - back
