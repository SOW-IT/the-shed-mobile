appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- tapOn: "E2E Test Campus"

- scrollUntilVisible:
    element:
      text: ".*Open.*Weekly Meeting.*"
    direction: DOWN
- tapOn:
    text: ".*Open.*Weekly Meeting.*"
- assertVisible:
    text: ".*signed in.*"

- tapOn:
    text: ".*Search.*"
    optional: true
- inputText: "e2e"

- runFlow:
    when:
      visible:
        text: ".*E2E.*"
    commands:
      - swipe:
          direction: LEFT
          from:
            text: ".*E2E.*"
      - tapOn:
          text: ".*E2E.*"
      - swipe:
          direction: RIGHT
          from:
            text: ".*E2E.*"
      - tapOn:
          text: "Close"
          optional: true

- assertVisible:
    text: ".*Create.*e2e.*"
    optional: true

- back
