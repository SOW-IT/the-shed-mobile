appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

# One screen since 2.8.0 (no Next steps): when, tags and campuses. Since
# 2.10.14 there's no calendar category to pick; it comes from tags and where.
- tapOn: "Create event"
- extendedWaitUntil:
    visible: "Shared with"
    timeout: 10000
- assertVisible: "Tags"
- assertVisible: "Runs over several days"
- assertNotVisible: "Calendar category"

# Leaving creates nothing.
- tapOn: "Cancel"
- assertNotVisible: "Shared with"
- assertVisible: "Events"
