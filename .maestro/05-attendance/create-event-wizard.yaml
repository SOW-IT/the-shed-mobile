appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- tapOn: "Create event"

- assertVisible:
    text: "Next"
- tapOn: "e.g. Weekly Meeting"
- inputText: "E2E Wizard Event"
- tapOn: "Next"

- tapOn: "Next"

- tapOn: "Next"

- assertVisible:
    text: ".*(Schedule|Start|End).*"

- tapOn: "Close"
- runFlow:
    when:
      visible:
        text: ".*Discard.*"
    commands:
      - tapOn:
          text: ".*Discard.*"
          optional: true

- tapOn: "Create event"
- assertVisible:
    text: ".*(Schedule|Start|End).*"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- assertVisible: "E2E Wizard Event"
- tapOn: "Close"
