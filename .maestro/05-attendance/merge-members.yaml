appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
- tapOn: "Members"

- tapOn: "+ Create member"
- tapOn: "Full name"
- inputText: "[E2E] Merge Keep"
- pressKey: Enter
- tapOn:
    text: "—.*"
    below: "GENDER"
- tapOn: "Male,.*"
- scrollUntilVisible:
    element: "DIETARY REQUIREMENTS"
    direction: DOWN
- tapOn:
    text: "—.*"
    below: "DIETARY REQUIREMENTS"
- tapOn: "Vegetarian,.*"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "New member"
    timeout: 10000

- tapOn: "+ Create member"
- tapOn: "Full name"
- inputText: "[E2E] Merge Dup"
- pressKey: Enter
- tapOn:
    text: "—.*"
    below: "GENDER"
- tapOn: "Female,.*"
- scrollUntilVisible:
    element: "DIETARY REQUIREMENTS"
    direction: DOWN
- tapOn:
    text: "—.*"
    below: "DIETARY REQUIREMENTS"
- tapOn: "Gluten Free,.*"
- scrollUntilVisible:
    element: "NOTES"
    direction: DOWN
- tapOn:
    below: "NOTES"
    index: 0
- inputText: "merge-e2e-note"
- pressKey: Enter
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "New member"
    timeout: 10000

- tapOn:
    text: ".*Search members.*"
- inputText: "Merge Keep"
- pressKey: Enter
- tapOn: ".*\\[E2E\\] Merge Keep.*"
- tapOn: "Merge duplicate"
- inputText: "Merge Dup"
- tapOn: "Merge with \\[E2E\\] Merge Dup"
- assertVisible: "KEEPING"
- assertVisible: "CHOOSE WHAT TO KEEP"

- scrollUntilVisible:
    element: "Female,.*"
    direction: DOWN
- tapOn: "Female,.*"
- scrollUntilVisible:
    element: "Gluten Free,.*"
    direction: DOWN
- assertVisible: "Vegetarian,.*"

- scrollUntilVisible:
    element:
      id: "merge-confirm-name"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "merge-confirm-name"
- inputText: "[e2e] merge dup"
- tapOn: ".*, Merge"
- assertVisible: "Merged \\[E2E\\] Merge Dup into \\[E2E\\] Merge Keep"

- tapOn:
    text: "Clear member search"
    optional: true
- tapOn:
    text: "Clear member search"
    optional: true
- tapOn:
    text: ".*Search members.*"
- inputText: "[E2E] Merge"
- pressKey: Enter
- assertVisible: ".*\\[E2E\\] Merge Keep.*"
- assertNotVisible: ".*\\[E2E\\] Merge Dup.*"
- tapOn: ".*\\[E2E\\] Merge Keep.*"
- assertVisible: "Female,.*"
- scrollUntilVisible:
    element: "Vegetarian,.*"
    direction: DOWN
- scrollUntilVisible:
    element: "merge-e2e-note"
    direction: DOWN

- tapOn: "Delete member"
- tapOn:
    id: "delete-confirm-name"
- inputText: "[E2E] Merge Keep"
- tapOn: "Delete permanently"
- assertVisible: "Deleted \\[E2E\\] Merge Keep"
