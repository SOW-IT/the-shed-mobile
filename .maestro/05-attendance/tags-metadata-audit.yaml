appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- tapOn: "Tags"
- scrollUntilVisible:
    element:
      text: ".*Add tag.*"
    direction: DOWN
    speed: 60
    timeout: 60000
    optional: true
- tapOn:
    text: ".*Add tag.*"
    optional: true
- scrollUntilVisible:
    element:
      text: ".*currently blue.*"
    direction: DOWN
    optional: true
- assertVisible:
    text: ".*(Applies to|colour|color).*"
    optional: true
- tapOn:
    text: "Discard tag"
    optional: true
- assertNotVisible:
    text: ".*unsaved changes.*"
    optional: true

- tapOn: "Metadata"
- assertVisible:
    text: ".*Year.*"

- tapOn: "Audit"
- tapOn:
    text: ".*Search.*"
    optional: true
- inputText: "e2e"
- tapOn:
    text: "Clear audit search"
    optional: true
- assertVisible: "Audit"
