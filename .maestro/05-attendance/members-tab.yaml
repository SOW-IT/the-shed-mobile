appId: ${APP_ID}
tags:
  - staff
---
- runFlow:
    file: ../common/sign-in-staff-to-attendance.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
- tapOn: "Members"

- assertVisible:
    text: ".*TOTAL:.*"

- tapOn:
    text: ".*Search.*"
- inputText: "zzzznomatch"
- assertVisible: "No members match"
- tapOn:
    text: "Clear member search"
- tapOn:
    text: "Clear member search"
    optional: true

- tapOn:
    text: ".*(Filter|Sort).*"
    optional: true
- assertVisible:
    text: ".*Clear All.*"
    optional: true
- tapOn:
    text: ".*(Filter|Sort).*"
    optional: true

- scrollUntilVisible:
    element:
      text: ".*E2E.*Member.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*E2E.*Member.*"
    optional: true
- assertVisible:
    text: "Delete member"
    optional: true
- tapOn:
    text: "Close"
    optional: true
