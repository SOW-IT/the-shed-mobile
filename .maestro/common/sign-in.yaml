appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${typeof E2E_SECRET !== 'undefined' && E2E_SECRET !== ''}
    commands:
      - runFlow:
          file: ./sign-in-e2e.yaml
          env:
            EMAIL: ${EMAIL}
- runFlow:
    when:
      true: ${typeof E2E_SECRET === 'undefined' || E2E_SECRET === ''}
    commands:
      - runFlow:
          file: ./sign-in-google.yaml
          env:
            EMAIL: ${EMAIL}
            PASSWORD: ${PASSWORD}
