appId: ${APP_ID}
---
- tapOn:
    text: "Sign in"
- extendedWaitUntil:
    visible:
      text: ".*Sign in with.*"
    timeout: 8000
- tapOn:
    text: ".*Sign in with.*"
- runFlow:
    when:
      visible: ".*Wants to Use.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Email or phone"
    commands:
      - tapOn: "Email or phone"
      - inputText: ${EMAIL}
      - tapOn: "Next"
      - extendedWaitUntil:
          visible: "Enter your password"
          timeout: 15000
          optional: true
      - tapOn:
          text: ".*(Enter your password|Password).*"
          optional: true
      - inputText: ${PASSWORD}
      - tapOn: "Next"
      - tapOn:
          text: "Continue"
          optional: true
- runFlow:
    when:
      visible: ".*Choose an account.*"
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
- extendedWaitUntil:
    visible:
      text: "Open menu.*"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "Attendance"
    timeout: 30000
    optional: true
