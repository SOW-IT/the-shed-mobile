appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${typeof CLEAR_STATE !== 'undefined' && CLEAR_STATE === 'true'}
    commands:
      - launchApp:
          appId: ${APP_ID}
          clearState: true
          permissions:
            notifications: unset
- runFlow:
    when:
      true: ${typeof CLEAR_STATE === 'undefined' || CLEAR_STATE !== 'true'}
    commands:
      - launchApp:
          appId: ${APP_ID}
- runFlow:
    when:
      true: ${typeof DEV_CLIENT !== 'undefined' && DEV_CLIENT === 'true'}
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      true: ${typeof DEV_CLIENT !== 'undefined' && DEV_CLIENT === 'true'}
      visible: "Go home"
    commands:
      - tapOn:
          point: "90%,47%"
