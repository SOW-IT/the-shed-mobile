appId: ${APP_ID}
---
- openLink: "${SCHEME}://e2e-auth?email=${EMAIL}&secret=${E2E_SECRET}"
- extendedWaitUntil:
    visible:
      text: ".*Org Chart.*"
    timeout: 20000
- runFlow:
    when:
      true: ${typeof DEV_CLIENT !== 'undefined' && DEV_CLIENT === 'true'}
    commands:
      - stopApp
- launchApp:
    appId: ${APP_ID}
- runFlow:
    when:
      true: ${typeof DEV_CLIENT !== 'undefined' && DEV_CLIENT === 'true'}
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      true: ${typeof DEV_CLIENT !== 'undefined' && DEV_CLIENT === 'true'}
      visible: "Go home"
    commands:
      - tapOn:
          point: "90%,47%"
- extendedWaitUntil:
    visible:
      text: "Open menu.*"
    timeout: 30000
