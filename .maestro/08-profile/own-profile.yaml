appId: ${APP_ID}
tags:
  - staff
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
- runFlow: ../common/open-profile.yaml

- assertVisible: ${STAFF_EMAIL}

- tapOn:
    text: ".*(SOW City Church|E2E Test Church).*"
- inputText: "E2E Test Church"
- assertVisible:
    text: ".*Save Church.*"
- tapOn:
    text: ".*Save Church.*"

- scrollUntilVisible:
    element:
      text: ".*(Service History|Service history).*"
    direction: DOWN
    optional: true

- assertNotVisible: "Sign out"
