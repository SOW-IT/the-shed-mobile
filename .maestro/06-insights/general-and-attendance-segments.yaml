appId: ${APP_ID}
tags:
  - staff
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}
# Staff have the Calendar as a tab, so Insights is in the side menu.
- runFlow: ../common/open-menu.yaml
- tapOn: "Insights"

- assertVisible: "General"
- assertVisible: "Attendance"

- tapOn:
    text: ".*Compare:.*"
    optional: true
- tapOn:
    text: "Close"
    optional: true

- tapOn: "Attendance"
- tapOn:
    text: ".*Time range:.*"
    optional: true
- assertVisible:
    text: "Past week"
    optional: true
- assertVisible:
    text: "Past month"
    optional: true
- assertVisible:
    text: "Past year"
    optional: true
- assertVisible:
    text: "Custom"
    optional: true
- assertVisible:
    text: "Collaborative events"
    optional: true
- tapOn:
    text: "Close"
    optional: true

- tapOn:
    text: ".*tap to expand.*"
    optional: true
- tapOn:
    text: "Close fullscreen"
    optional: true
