appId: ${APP_ID}
tags:
  - auth
  - smoke
---
- runFlow: ../common/launch-fresh.yaml
- runFlow:
    file: ../common/sign-in-google.yaml
    env:
      EMAIL: ${STAFF_EMAIL}
      PASSWORD: ${STAFF_PASSWORD}

- assertVisible:
    text: "Attendance"
    optional: true
- assertVisible:
    text: ".*Notifications.*"
    optional: true

- tapOn:
    text: "Open menu.*"
    optional: true
- tapOn:
    text: "Profile"
    optional: true
- assertVisible:
    text: ${STAFF_EMAIL}
    optional: true
