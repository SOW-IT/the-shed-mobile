appId: ${APP_ID}
tags:
  - public
---
- runFlow: ../common/ensure-signed-out.yaml
- assertVisible:
    text: ".*Home, tab.*"
- assertNotVisible:
    text: ".*Insights, tab.*"

# A link to Insights lands on Home instead. The tab bar is always there, so
# wait for something only Home shows.
- runFlow:
    file: ../common/open-deeplink.yaml
    env:
      PATH: "insights"
- extendedWaitUntil:
    visible: "Our values"
    timeout: 15000
- assertNotVisible: "General"
