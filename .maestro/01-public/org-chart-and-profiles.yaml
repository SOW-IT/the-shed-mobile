appId: ${APP_ID}
tags:
  - public
---
- runFlow: ../common/ensure-signed-out.yaml
- tapOn:
    text: ".*Org Chart, tab.*"

- tapOn:
    id: "org-person"
    index: 0
    optional: true
- runFlow:
    when:
      notVisible: ".*(Service History|Service history).*"
    commands:
      - scrollUntilVisible:
          element:
            id: "org-person"
          direction: DOWN
      - tapOn:
          id: "org-person"
          index: 0

- assertVisible:
    text: ".*(Service History|Service history).*"
    optional: true
- assertNotVisible: "Local church"
