appId: ${APP_ID}
tags:
  - public
---
- runFlow: ../common/ensure-signed-out.yaml
- tapOn:
    text: ".*Home, tab.*"
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- assertVisible: "Partner"
- scrollUntilVisible:
    element:
      text: "Your email"
    direction: DOWN

- tapOn: "you@example.com"
- inputText: "not-an-email"
- tapOn: "Contact us"
- tapOn: "How can we help?"
- inputText: "Hi there, this is a test message."
- tapOn: "Contact us"
- tapOn: "Send message"
- assertVisible: "Please enter a valid email address."

- tapOn: "not-an-email"
- eraseText
- inputText: "e2e-visitor@example.com"
- tapOn: "Contact us"
- tapOn: "Hi there, this is a test message."
- eraseText
- tapOn: "Contact us"
- assertVisible:
    text: "Send message"
    enabled: false

- runFlow: ../common/launch-fresh.yaml
- tapOn:
    text: ".*Home, tab.*"
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- assertVisible: "Partner"
- scrollUntilVisible:
    element:
      text: "Your email"
    direction: DOWN
- tapOn: "you@example.com"
- inputText: "e2e-visitor@example.com"
- tapOn: "Contact us"
- tapOn: "How can we help?"
- inputText: "Hello — automated E2E contact test."
- tapOn: "Contact us"
- tapOn: "Send message"
- extendedWaitUntil:
    visible:
      text: ".*(Message sent|Thanks for reaching out).*"
    timeout: 15000
- tapOn:
    text: "Done"
    optional: true
